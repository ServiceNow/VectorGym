# Backend presets for VectorGym
# Use with: python -m vectorgym.cli task=text2svg backend=vllm model_name=/path/to/hf/model

vllm:
  backend: vllm
  model_name: ""  # Must be set via CLI: model_name=/path/to/hf/model
  torch_dtype: float16
  generation_params:
    max_length: 8096
    num_generations: 1
    temperature: 0.0
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    min_p: 0.0
  dataset:
    batch_size: 8
    num_workers: 2
    rasterize_size: 512
    render_size: 512

openrouter:
  backend: openrouter
  model_name: gpt-4o  # Default model, override via CLI: model_name=claude-3.5-sonnet
  generation_params:
    max_length: 2048
    num_generations: 1
    temperature: 0.0
  dataset:
    batch_size: 1  # Required for API
    num_workers: 1
    rasterize_size: 512
    render_size: 512
  # Metrics are set automatically by the validator based on task

